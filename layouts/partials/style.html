<style>
  :root {
    --width: 720px;
    --font-main: InterDisplay, sans-serif;
    --font-secondary: Inter, sans-serif;
    --font-scale: 1em;
    --background-color: #fff;
    --heading-color: #222;
    --text-color: #444;
    --link-color: #3273dc;
    --visited-color: #3273dc;
    --blockquote-color: #222;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --background-color: #01242e;
      --heading-color: #eee;
      --text-color: #ddd;
      --link-color: #8cc2dd;
      --visited-color: #8cc2dd;
      --blockquote-color: #ccc;
    }
  }

  body {
    font-family: var(--font-secondary);
    font-size: var(--font-scale);
    margin: auto;
    padding: 20px;
    max-width: var(--width);
    text-align: left;
    background-color: var(--background-color);
    word-wrap: break-word;
    overflow-wrap: break-word;
        line-height: 1.5;
    font-variant-numeric: tabular-nums;
    -webkit-font-feature-settings: "tnum";
    font-feature-settings: "tnum";
    color: var(--text-color);
  }

  h1,
  h2,
  h3,
  h4,
  h5,
  h6 {
    font-family: var(--font-main);
    color: var(--heading-color);
    line-height: 1.2;
  }

  a {
    color: var(--link-color);
    cursor: pointer;
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline !important;
  }

  a.title,
  a.title:hover,
  .title,
  .title:hover {
    text-decoration: none !important;
  }

  .title h1 {
    font-size: 1.5em;
  }

  strong,
  b {
    color: var(--heading-color);
  }

  button {
    margin: 0;
    cursor: pointer;
  }

  main {
    line-height: 1.6;
  }

  main > *:last-child {
    margin: 0 !important;
  }

  blockquote {
    border-left: 1px solid #999;
    color: var(--blockquote-color);
    padding-left: 20px;
    font-style: italic;
  }

  img {
    max-width: 100%;
  }

  code {
    font-family: monospace;
    padding: 2px;
    border-radius: 3px;
  }

  .inline {
    width: auto !important;
  }

  .highlight,
  .code {
    border-radius: 3px;
    margin-block-start: 1em;
    margin-block-end: 1em;
    overflow-x: auto;
  }

  .highlight pre,
  .code pre {
    min-width: 100%;
    width: max-content;
  }

  /* Tanggal Sembunyi */
  time,
  .blog-date,
  .post-date {
    display: none !important;
  }

  /* Blog Post List (Em Dash & Hanging Indent) */
  ul.blog-posts {
    list-style: none !important;
    padding-left: 0 !important;
  }

  ul.blog-posts li {
    display: flex !important;
    align-items: baseline !important;
    margin: 0 !important;
  }

  ul.blog-posts li > span:first-child {
    display: inline-block !important;
    flex-shrink: 0 !important;
    font-size: 0 !important;
    line-height: 1 !important;
    margin-right: 0.5rem !important;
    user-select: none;
  }

  ul.blog-posts li > span:first-child::before {
    content: "—" !important;
    font-size: 1rem !important;
    color: var(--text-color) !important;
  }

  ul.blog-posts li > a {
    flex: 1 1 auto !important;
    text-align: left !important;
  }

  /* Navigasi Desktop / PC (Mengalir Alami) */
  .site-nav {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 0.35rem 0.6rem;
    line-height: 1.4;
    margin-top: 0.25rem;
    margin-bottom: 1.25rem;
  }

  .site-nav .nav-bracket {
    display: none !important;
  }

  .site-nav .nav-item {
    display: inline-flex;
    align-items: baseline;
    white-space: nowrap;
    user-select: none;
  }

  .site-nav .nav-item a {
    color: var(--link-color);
    text-decoration: none;
    white-space: nowrap;
  }

  .site-nav .nav-item a:hover {
    text-decoration: underline !important;
  }

  .site-nav .nav-item a.active {
    font-weight: 700 !important;
  }

  .site-nav .nav-item:not(:last-child)::after {
    content: "/";
    margin-left: 0.6rem;
    color: var(--text-color);
    opacity: 0.35;
    font-weight: 300;
  }

  /* Garis Pemisah (HR, Footer, Post Nav) */
  

  

  nav.post-nav {
    border-top: 1px dashed var(--heading-color) !important;
  }

  /* Elemen Footer */
  .footer-row {
    display: inline-flex;
    align-items: baseline;
  }

  .footer-icon {
    display: inline-block;
    width: 1.15rem;
    flex-shrink: 0;
    text-align: left;
    user-select: none;
  }

  .top-arrow {
    color: var(--link-color);
  }

  .footer-text {
    display: inline-block;
    text-align: left;
  }

  .footer-text a {
    color: var(--link-color);
    text-decoration: none;
  }

  .footer-text a:hover {
    text-decoration: underline !important;
  }

  /* Tabel Artikel & Glosarium */
  table {
    width: 100%;
    border-collapse: collapse;
    margin: 1.5rem 0;
  }

  table,
  table th,
  table td,
  table thead th,
  table thead tr,
  th,
  td {
    border: 1px dashed var(--heading-color) !important;
  }

  th,
  td {
    padding: 0.6rem 0.75rem;
    text-align: center;
    color: var(--text-color);
    vertical-align: top !important;
  }

  table th,
  table thead th,
  th {
    color: var(--heading-color) !important;
    font-family: InterDisplay, sans-serif !important;
    font-weight: 700 !important;
    text-transform: uppercase !important;
    position: relative;
    border-bottom: 1px dashed var(--heading-color) !important;
  }

  table thead tr {
    border-bottom: 1px dashed var(--heading-color) !important;
  }

  /* Tabel Glosarium Grid */
  table.glossary-grid {
    table-layout: fixed;
    width: 100%;
    border-collapse: collapse;
  }

  table.glossary-grid td {
    padding: 0;
    width: 16.666%;
    text-align: center;
    transition: background-color 0.15s ease;
  }

  table.glossary-grid td a {
    display: block;
    padding: 0.75rem 0;
    font-weight: 600;
    text-decoration: none !important;
    width: 100%;
    height: 100%;
    color: var(--link-color);
  }

  table.glossary-grid td a:hover {
    text-decoration: none !important;
  }

  table.glossary-grid td:hover:has(a),
  table.glossary-grid td a:hover {
    background-color: rgba(125, 125, 125, 0.12);
  }

  table.glossary-grid td .disabled-letter {
    display: block;
    padding: 0.75rem 0;
    font-weight: 600;
    color: var(--heading-color);
    user-select: none;
    cursor: default;
  }

  /* Media Queries: Mobile / HP (<= 600px) */
  @media (max-width: 600px) {
    h1,
    .title h1 {
      margin-bottom: 0.35rem !important;
    }

    .site-nav {
      display: grid !important;
      grid-template-columns: max-content max-content !important;
      justify-content: flex-start !important;
      column-gap: 1.25rem !important;
      row-gap: 0.35rem !important;
      margin-bottom: 0.85rem !important;
      font-size: 0.95rem;
      width: 100%;
    }

    .site-nav .nav-item:not(:last-child)::after {
      content: none !important;
    }

    .site-nav .nav-item {
      display: flex !important;
      align-items: center !important;
      width: 100% !important;
    }

    .site-nav .nav-item:nth-child(odd) {
      justify-content: space-between !important;
    }

    .site-nav .nav-item:nth-child(odd)::after {
      content: "/" !important;
      color: var(--text-color) !important;
      opacity: 0.35 !important;
      font-weight: 300 !important;
      margin-left: 1.25rem !important;
      user-select: none;
    }

    .site-nav .nav-item:nth-child(even) {
      justify-content: flex-start !important;
    }

    
  }

  
  
  
  
  
  
  

  /* Hilangkan border bawah pada details terakhir agar tidak bertabrakan dengan garis footer */
  

  /* FAQ Accordion Styling - Ramping & Rapi */
  details {
    border-bottom: 1px dashed var(--heading-color);
    padding: 0.5rem 0;
    margin: 0;
  }

  

  details summary {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
    font-weight: bold;
    list-style: none;
    color: var(--heading-color);
    -webkit-user-select: none;
    user-select: none;
  }

  details summary:hover {
    text-decoration: underline;
  }

  details summary::-webkit-details-marker {
    display: none;
  }

  details summary::before {
    content: "";
    display: inline-block;
    width: 8px;
    height: 10px;
    margin-top: 0.32em;
    flex-shrink: 0;
    background-color: currentColor;
    -webkit-clip-path: polygon(0 0, 100% 50%, 0 100%);
    clip-path: polygon(0 0, 100% 50%, 0 100%);
    transition: transform 0.15s ease;
    transform-origin: center center;
  }

  details[open] > summary::before {
    transform: rotate(90deg);
  }

  details > p,
  details > ul,
  details > ol {
    margin-top: 0.6rem;
    margin-bottom: 0.4rem;
    margin-left: 16px;
    line-height: 1.5;
  }

  /* Jeda Spasi Heading Antar-Tingkat FAQ */
  main h3 {
    margin-top: 2rem !important;
    margin-bottom: 0.75rem !important;
  }

  /* Hilangkan garis bawah akordeon paling akhir (agar tidak dobel dengan garis footer) */
  

  /* Details terakhir tanpa border-bottom agar footer menjadi garis tunggal */
  

  /* Berikan jeda rapi saat akordeon terakhir dibuka */
  

  /* Jarak vertikal simetris: 1.25rem di atas garis, 1.25rem di bawah garis */
  

  /* Details terakhir: tanpa border-bottom karena digantikan border-top footer */
  

  

  /* Garis Footer: jarak atas dan bawah seimbang presisi (0.75rem) */
  

  /* Details terakhir: tanpa padding dan margin bawah agar persis menempel ke garis footer */
  details:last-of-type {
    border-bottom: none !important;
    padding-bottom: 0 !important;
    margin-bottom: 0 !important;
  }

  details:last-of-type[open] {
    padding-bottom: 0.25rem !important;
  }

  /* Footer: jarak atas (margin-top + padding-top) dan bawah (padding-bottom) presisi simetris 0.75rem */
  footer {
    margin-top: 0.75rem !important;
    padding: 0.75rem 0 0.75rem 0 !important;
    border-top: 1px dashed var(--heading-color) !important;
    font-size: 0.85rem;
    opacity: 1 !important;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Standardisasi Garis Pemisah (HR) */
  hr {
    border: none !important;
    border-top: 1px dashed var(--heading-color) !important;
    margin: 1.25rem 0 !important;
    opacity: 1 !important;
  }
</style>
