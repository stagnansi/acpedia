<div class="footer-row back-to-top" id="back-to-top" style="display: none;">
  <span class="footer-icon top-arrow">↑</span>
  <span class="footer-text"><a href="#">Kembali ke atas</a></span>
</div>

<script>
  (function() {
    function toggleBackToTop() {
      var btn = document.getElementById("back-to-top");
      if (!btn) return;
      var hasScroll = document.documentElement.scrollHeight > window.innerHeight;
      btn.style.display = hasScroll ? "inline-flex" : "none";
    }
    window.addEventListener("DOMContentLoaded", toggleBackToTop);
    window.addEventListener("load", toggleBackToTop);
    window.addEventListener("resize", toggleBackToTop);
  })();
</script>
